services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chat_app
      POSTGRES_USER: chat_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_app -d chat_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/infrastructure/database/migrate.js", "up"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: chat_app
      DB_USER: chat_app
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: chat_app
      DB_USER: chat_app
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
